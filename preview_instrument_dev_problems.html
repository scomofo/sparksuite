<!DOCTYPE html>
<html>
<body>
<iframe id="app" style="width:100%;height:100vh;border:0"></iframe>
<script src="js/dev/dev_validation_navigator.js"></script>
<script src="js/dev/dev_validation_issue_parser.js"></script>
<script src="js/dev/dev_issue_console.js"></script>
<script>
const p=new URLSearchParams(location.search);const inst=p.get('instrument');
let s={};try{s=JSON.parse(localStorage.getItem('chordspark_state')||'{}')}catch{}
s.activeInstrument=inst;localStorage.setItem('chordspark_state',JSON.stringify(s));
const iframe=document.getElementById('app');iframe.src='index.html';
let last=null;async function chk(){try{const r=await fetch('.preview_reload?ts='+Date.now());const t=await r.text();if(last===null){last=t;return;}if(t!==last){last=t;iframe.src='index.html?ts='+Date.now();}}catch{}}
setInterval(chk,1000);
</script>
</body>
</html>
