<div class="w-1 h-3 bg-white/20 translate-y-28"></div>
<div class="w-1 h-3 bg-white/20 -rotate-90 translate-x-28"></div>
<div class="w-1 h-3 bg-white/20 rotate-90 -translate-x-28"></div>
<!-- Active Center Mark -->

</div>
</div>
</div>

</div>
</div>

</div>

<span class="material-symbols-outlined text-warning">library_music</span>
</div>
<span class="font-label text-[10px] text-text-secondary uppercase">Chords</span>

</div>

<button class="flex flex-col items-center justify-center text-stone-500 opacity-70 hover:text-orange-300 transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">construction</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium uppercase tracking-widest mt-1">Tools</span>

<button class="flex flex-col items-center justify-center text-stone-500 opacity-70 hover:text-orange-300 transition-all active:scale-90 duration-200">
