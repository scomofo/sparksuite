<script src="js/instruments/piano/pages/shared.js"></script>
<script src="js/instruments/piano/pages/practice.js"></script>
<script src="js/instruments/piano/pages/session.js"></script>
<script src="js/instruments/piano/pages/games.js"></script>
<script src="js/instruments/piano/pages/songs.js"></script>
<script src="js/instruments/piano/pages/tools.js"></script>
<script src="js/instruments/piano/pages/perform.js"></script>
<script src="js/instruments/piano/pages/perform_song.js"></script>
<script src="js/instruments/piano/pages/perform_results.js"></script>
<script src="js/instruments/piano/pages/plan.js"></script>
<script src="js/instruments/piano/pages/analytics.js"></script>
<script src="js/instruments/piano/pages/editor.js"></script>
<script src="js/instruments/piano/pages/onboarding.js"></script>
<script>
// Register piano pages directly on instrument
(function() {
  var inst = SparkInstruments.getAll();
  var piano = null;
  for (var i = 0; i < inst.length; i++) {
    if (inst[i].id === "pianospark") { piano = inst[i]; break; }
  }
  if (!piano) return;

  // Piano uses shared homePage() with its own tabs + tabRenderers
  piano.pages = {};
  if (typeof pianoSessionPage === "function") piano.pages[SCR.SESSION] = pianoSessionPage;
  if (typeof pianoPerformPage === "function") piano.pages[SCR.PERFORM] = pianoPerformPage;
  if (typeof pianoPerformDonePage === "function") piano.pages[SCR.PERFORM_DONE] = pianoPerformDonePage;
  if (typeof pianoPerformSongPage === "function") piano.pages[SCR.PERFORM_SONG] = pianoPerformSongPage;
  if (typeof pianoPlanPage === "function") piano.pages[SCR.PLAN] = pianoPlanPage;
  if (typeof pianoAnalyticsPage === "function") piano.pages[SCR.INSIGHTS] = pianoAnalyticsPage;
  if (typeof pianoEditorPage === "function") piano.pages[SCR.PERF_EDITOR] = pianoEditorPage;
  if (typeof pianoOnboardingPage === "function") piano.pages[SCR.ONBOARDING] = pianoOnboardingPage;
  if (typeof pianoStemsPlayerPage === "function") piano.pages[SCR.STEMS] = pianoStemsPlayerPage;
})();
  // Initial render — deferred to here so all instrument pages are registered
  if (typeof render === "function") render();
</script>
</body>
</html>
