<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ukulele Chord Smoke-Test Gallery</title>
  <style>
    :root {
      --svg-nut: #333;
      --svg-fret: #ccc;
      --svg-string: #666;
      --text-muted: #999;
      --text-primary: #333;
      --border: #ddd;
      --card-bg: #f9f9f9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: var(--text-primary);
      padding: 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 40px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .status-banner {
      padding: 12px 16px;
      border-radius: 4px;
      margin: 20px 0;
      font-weight: 500;
    }

    .status-banner.success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #4caf50;
    }

    .status-banner.error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #f44336;
    }

    .gallery {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .chord-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .chord-card:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .chord-card.error {
      background-color: #ffcdd2;
      border-color: #f44336;
    }

    .chord-card h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .chord-card svg {
      display: block;
      margin: 0 auto 8px;
      max-width: 100%;
      height: auto;
    }

    .chord-errors {
      font-size: 12px;
      color: #c62828;
      text-align: left;
      margin-top: 8px;
      padding: 4px;
      background: rgba(244, 67, 54, 0.1);
      border-radius: 2px;
    }

    .chord-errors p {
      margin: 2px 0;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
    }

    @keyframes barreIn {
      from {
        opacity: 0;
        transform: scaleX(0);
      }
      to {
        opacity: 0.85;
        transform: scaleX(1);
      }
    }

    @keyframes fingerIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Ukulele Chord Gallery</h1>
    <p>Smoke-test page for ukulele chord diagram rendering</p>
    <div id="status-banner" class="status-banner success">Loading...</div>
  </header>

  <div class="gallery" id="gallery"></div>

  <footer>
    <p>This page loads ukulele chord pipeline scripts and renders a test gallery of chord diagrams.</p>
  </footer>

  <!-- Load ukulele chord pipeline scripts -->
  <script src="../js/ui/stringed_chord_svg.js"></script>
  <script src="../js/instruments/ukulele/chord_normalizer.js"></script>
  <script src="../js/instruments/ukulele/validator.js"></script>
  <script src="../js/instruments/ukulele/ukulele_svg.js"></script>

  <!-- Inline escHTML function -->
  <script>
    function escHTML(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Test chord shapes (compact format)
    const testChords = {
      C:       [0, 0, 0, 3],
      Am:      [2, 0, 0, 0],
      F:       [2, 0, 1, 0],
      G:       [0, 2, 3, 2],
      G7:      [0, 2, 1, 2],
      Dm:      [2, 2, 1, 0],
      Em:      [0, 4, 3, 2],
      A:       [2, 1, 0, 0],
      D:       [2, 2, 2, 0],
      E:       [1, 4, 0, 2],
      Bb:      [3, 2, 1, 1],
      C7:      [0, 0, 0, 1],
      Am7:     [0, 0, 0, 0],
      Dm7:     [2, 2, 1, 3],
      Em7:     [0, 2, 0, 2],
      Cmaj7:   [0, 0, 0, 2],
      Fmaj7:   [2, 4, 1, 3],
      A7:      [0, 1, 0, 0]
    };

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const statusBanner = document.getElementById('status-banner');
      let errorCount = 0;
      let totalCount = 0;

      // Render each chord
      for (const [chordName, shape] of Object.entries(testChords)) {
        totalCount++;

        // Create chord card
        const card = document.createElement('div');
        card.className = 'chord-card';

        // Create title
        const title = document.createElement('h3');
        title.textContent = chordName;
        card.appendChild(title);

        try {
          // Normalize chord
          const source = { name: chordName, shape: shape };
          const chart = window.normalizeUkuleleChord(source);

          // Validate chord
          const errors = window.validateChordChart(chart);

          if (errors.length > 0) {
            errorCount++;
            card.classList.add('error');

            // Show errors
            const errDiv = document.createElement('div');
            errDiv.className = 'chord-errors';
            errors.forEach(err => {
              const p = document.createElement('p');
              p.textContent = '• ' + err;
              errDiv.appendChild(p);
            });
            card.appendChild(errDiv);
          } else {
            // Render SVG
            const svg = window.ukuleleSVG(chart, { width: 170 });
            const svgContainer = document.createElement('div');
            svgContainer.innerHTML = svg;
            card.appendChild(svgContainer);
          }
        } catch (err) {
          errorCount++;
          card.classList.add('error');

          const errDiv = document.createElement('div');
          errDiv.className = 'chord-errors';
          const p = document.createElement('p');
          p.textContent = '• Exception: ' + err.message;
          errDiv.appendChild(p);
          card.appendChild(errDiv);
        }

        gallery.appendChild(card);
      }

      // Update status banner
      if (errorCount === 0) {
        statusBanner.className = 'status-banner success';
        statusBanner.textContent = 'Rendered ' + totalCount + ' chords. All valid!';
      } else {
        statusBanner.className = 'status-banner error';
        statusBanner.textContent = totalCount + ' chord(s) rendered. ' + errorCount + ' validation error(s) found.';
      }
    }

    // Wait for scripts to load, then render
    document.addEventListener('DOMContentLoaded', renderGallery);
  </script>
</body>
</html>
